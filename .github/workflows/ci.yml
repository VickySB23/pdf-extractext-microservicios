name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - name: Construir las imágenes desde los repositorios de cada servicio
        run: docker compose build
